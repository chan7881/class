name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run build
        env:
          # 실제 Apps Script 배포 후, 리포 Settings > Secrets and variables > Actions > Variables에
          # VITE_API_MODE=live, VITE_APPS_SCRIPT_URL=<배포 URL>을 등록하면 이 워크플로만으로 전환된다.
          # 등록 전에는 비어 있어 기존과 동일하게 mock 모드로 빌드된다(apps-script/SETUP.md 참고).
          VITE_API_MODE: ${{ vars.VITE_API_MODE }}
          VITE_APPS_SCRIPT_URL: ${{ vars.VITE_APPS_SCRIPT_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
